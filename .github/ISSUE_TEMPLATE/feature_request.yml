name: Feature request
description: Suggest a concrete improvement to the research workflow
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What research task is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Include the platform and a concrete example.
    validations:
      required: true
