name: Android APK startup

on:
  workflow_dispatch:
    inputs:
      apk_version:
        description: APK version to install and launch.
        required: true
        default: 0.3.6
      apk_source:
        description: Test a published release or the signed APK committed on this ref.
        type: choice
        required: true
        default: published
        options: [published, committed]
      api_level:
        description: Android API level to test.
        type: choice
        required: true
        default: '36'
        options: ['36', '26']

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APK_VERSION: ${{ inputs.apk_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download the published signed APK
        if: inputs.apk_source == 'published'
        run: |
          [[ "$APK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir apk
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$APK_VERSION"
          curl --fail --location --retry 3 "$base/research-bot-$APK_VERSION-android.apk" -o apk/app.apk
      - name: Use the committed signed APK
        if: inputs.apk_source == 'committed'
        run: |
          [[ "$APK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir apk
          (cd downloads/android && sha256sum --check SHA256SUMS.txt)
          cp "downloads/android/research-bot-$APK_VERSION-android.apk" apk/app.apk
      - name: Install the persistent Android accessibility driver
        run: |
          python3 -m venv "$RUNNER_TEMP/research-android-qa"
          "$RUNNER_TEMP/research-android-qa/bin/pip" install uiautomator2==3.7.0
          echo "RESEARCH_UIAUTOMATOR_PYTHON=$RUNNER_TEMP/research-android-qa/bin/python" >> "$GITHUB_ENV"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and cold-launch the released APK
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/android-startup-smoke.mjs apk/app.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-${{ inputs.apk_version }}-api-${{ inputs.api_level }}
          path: android-startup-results/
          if-no-files-found: ignore
