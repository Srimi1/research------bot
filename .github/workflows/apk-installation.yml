name: Android APK installation

on:
  pull_request:
    paths:
      [
        'android/**',
        'scripts/android-*.mjs',
        'scripts/verify-android-apk.mjs',
        'package*.json',
        '.github/workflows/apk-installation.yml',
      ]
  workflow_dispatch:
    inputs:
      verify_release_key:
        description: Check the existing release key only, without building or publishing an APK.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signing:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release_key
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Restore the existing key for verification
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const name of ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']) {
            if (!process.env[name]) throw new Error(`${name} is missing. Restore the existing release signing configuration.`);
          }
          const encoded = process.env.ANDROID_KEYSTORE_BASE64.replace(/\s/g, '');
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)) throw new Error('ANDROID_KEYSTORE_BASE64 is not base64 text. Restore the original keystore backup.');
          const bytes = Buffer.from(encoded, 'base64');
          if (!bytes.length || bytes.toString('base64').replace(/=+$/, '') !== encoded.replace(/=+$/, '')) throw new Error('ANDROID_KEYSTORE_BASE64 is incomplete or invalid.');
          const path = join(process.env.RUNNER_TEMP, 'research-release-check.jks');
          writeFileSync(path, bytes, { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `ANDROID_KEYSTORE_PATH=${path}\n`);
          NODE
      - name: Verify the private key and pinned certificate
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdtempSync, rmSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const fixture = mkdtempSync(join(process.env.RUNNER_TEMP, 'research-signing-check-'));
          try {
            copyFileSync('android/release-signing-certificate.sha256', join(fixture, 'release-signing-certificate.sha256'));
            writeFileSync(join(fixture, 'settings.gradle'), "rootProject.name = 'release-signing-check'\n");
            const script = resolve('android/release-signing.gradle').replaceAll('\\', '\\\\').replaceAll("'", "\\'");
            writeFileSync(join(fixture, 'build.gradle'), `apply from: '${script}'\n`);
            const result = spawnSync('bash', [resolve('android/gradlew'), '--no-daemon', '--console=plain', '--max-workers=2', '-p', fixture, 'verifyReleaseSigning'], { stdio: 'inherit', timeout: 300_000 });
            if (result.error) throw new Error('The release signing check could not run.');
            process.exitCode = result.status ?? 1;
          } finally {
            rmSync(fixture, { recursive: true, force: true });
          }
          NODE
      - name: Remove the private key
        if: always()
        run: rm -f "$RUNNER_TEMP/research-release-check.jks"

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_release_key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: node scripts/android-signing-smoke.mjs
      - run: npm run android:apk:check
      - uses: actions/upload-artifact@v4
        with:
          name: research-bot-install-check
          path: android/app/build/outputs/apk/installCheck/app-installCheck.apk
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: ['26', '36']
    env:
      RESEARCH_INSTALL_TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          name: research-bot-install-check
          path: apk
      - name: Install the Android accessibility driver
        if: matrix.api == '36'
        run: |
          python3 -m venv "$RUNNER_TEMP/research-android-qa"
          "$RUNNER_TEMP/research-android-qa/bin/pip" install uiautomator2==3.7.0
          echo "RESEARCH_UIAUTOMATOR_PYTHON=$RUNNER_TEMP/research-android-qa/bin/python" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check fresh installation and remaining-user certificate conflicts
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            node scripts/android-emulator-ready.mjs
            node scripts/android-installation-smoke.mjs apk/app-installCheck.apk
            if [ "$RESEARCH_INSTALL_TEST_API" = 36 ]; then RESEARCH_ANDROID_PACKAGE=com.researchbot.android.installcheck RESEARCH_ANDROID_RESULTS=android-startup-results/install-check node scripts/android-startup-smoke.mjs apk/app-installCheck.apk; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-installation-api-${{ matrix.api }}
          path: android-startup-results/
          if-no-files-found: ignore
