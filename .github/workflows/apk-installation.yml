name: Android APK installation

on:
  pull_request:
    paths:
      [
        'android/**',
        'scripts/android-*.mjs',
        'scripts/verify-android-apk.mjs',
        'package*.json',
        '.github/workflows/apk-installation.yml',
      ]
  workflow_dispatch:
    inputs:
      verify_release_key:
        description: Check the existing release key only, without building or publishing an APK.
        type: boolean
        default: false
      complete_pending_releases:
        description: Attach the verified 0.4.2 test APK to its draft and publish the validated 0.4.1 desktop release.
        type: boolean
        default: false
      publish_verified_release:
        description: Publish the already uploaded production 0.4.2 APK after verifying its checksums and passed runtime evidence.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signing:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release_key && !inputs.complete_pending_releases && !inputs.publish_verified_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Restore the existing key for verification
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: node scripts/restore-android-signing.mjs "$RUNNER_TEMP/research-release-check.jks"
      - name: Verify the private key and pinned certificate
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdtempSync, rmSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const fixture = mkdtempSync(join(process.env.RUNNER_TEMP, 'research-signing-check-'));
          try {
            copyFileSync('android/release-signing-certificate.sha256', join(fixture, 'release-signing-certificate.sha256'));
            writeFileSync(join(fixture, 'settings.gradle'), "rootProject.name = 'release-signing-check'\n");
            const script = resolve('android/release-signing.gradle').replaceAll('\\', '\\\\').replaceAll("'", "\\'");
            writeFileSync(join(fixture, 'build.gradle'), `apply from: '${script}'\n`);
            const result = spawnSync('bash', [resolve('android/gradlew'), '--no-daemon', '--console=plain', '--max-workers=2', '-p', fixture, 'verifyReleaseSigning'], { stdio: 'inherit', timeout: 300_000 });
            if (result.error) throw new Error('The release signing check could not run.');
            process.exitCode = result.status ?? 1;
          } finally {
            rmSync(fixture, { recursive: true, force: true });
          }
          NODE
      - name: Remove the private key
        if: always()
        run: rm -f "$RUNNER_TEMP/research-release-check.jks"

  build:
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_release_key && !inputs.complete_pending_releases && !inputs.publish_verified_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: node scripts/android-signing-smoke.mjs
      - run: npm run android:apk:check
      - uses: actions/upload-artifact@v4
        with:
          name: research-bot-install-check
          path: android/app/build/outputs/apk/installCheck/app-installCheck.apk
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: ['26', '36']
    env:
      RESEARCH_INSTALL_TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          name: research-bot-install-check
          path: apk
      - name: Install the Android accessibility driver
        if: matrix.api == '36'
        run: |
          python3 -m venv "$RUNNER_TEMP/research-android-qa"
          "$RUNNER_TEMP/research-android-qa/bin/pip" install uiautomator2==3.7.0
          echo "RESEARCH_UIAUTOMATOR_PYTHON=$RUNNER_TEMP/research-android-qa/bin/python" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check fresh installation and remaining-user certificate conflicts
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            node scripts/android-emulator-ready.mjs
            node scripts/android-installation-smoke.mjs apk/app-installCheck.apk
            if [ "$RESEARCH_INSTALL_TEST_API" = 36 ]; then RESEARCH_ANDROID_PACKAGE=com.researchbot.android.installcheck RESEARCH_ANDROID_RESULTS=android-startup-results/install-check node scripts/android-startup-smoke.mjs apk/app-installCheck.apk; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-installation-api-${{ matrix.api }}
          path: android-startup-results/
          if-no-files-found: ignore

  complete_pending_releases:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_pending_releases && !inputs.publish_verified_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - name: Download the exact APK that passed both installation jobs
        uses: actions/download-artifact@v4
        with:
          name: research-bot-install-check
          run-id: 37905089245
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Verify the original APK bytes and build information
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { verifyAndroidApk } from './scripts/verify-android-apk.mjs';
          const expected = JSON.parse(readFileSync('docs/releases/v0.4.2-install-check.json', 'utf8'));
          const actual = verifyAndroidApk('verified-apk/app-installCheck.apk', 'install-check');
          for (const key of ['kind', 'version', 'versionCode', 'package', 'minSdk', 'targetSdk', 'debuggable', 'certificateSha256', 'apkSha256', 'apkBytes'])
            assert.equal(actual[key], expected[key], `The tested APK differs: ${key}`);
          assert.equal(expected.source.githubActionsArtifactId, 11604044023);
          NODE
      - name: Populate the 0.4.2 draft and publish the completed 0.4.1 desktop release
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Srimi1/research------bot
          draft="$(gh release view v0.4.2 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$draft" = true
          mkdir upload
          cp verified-apk/app-installCheck.apk upload/research-bot-0.4.2-android-install-check.apk
          cp docs/releases/v0.4.2-install-check.json upload/BUILD_INFO-android-install-check.json
          cp docs/audits/2026-10-09-releases-and-apks.md upload/RELEASE_AUDIT-2026-10-09.md
          (cd upload && sha256sum BUILD_INFO-android-install-check.json research-bot-0.4.2-android-install-check.apk > SHA256SUMS-android-install-check.txt)
          gh release upload v0.4.2 upload/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v0.4.2 --repo "$GITHUB_REPOSITORY" --draft=true --notes-file docs/releases/v0.4.2.md
          gh release upload v0.4.1 upload/RELEASE_AUDIT-2026-10-09.md --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v0.4.1 --repo "$GITHUB_REPOSITORY" --target 3fd315152dab9f09d3849e51ac043e0df3b9a235 \
            --draft=false --prerelease=false --latest --notes-file docs/releases/v0.4.1.md

  publish_verified_release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_verified_release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the uploaded production files and their passed runtime evidence
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Srimi1/research------bot
          gh release download v0.4.2 --repo "$GITHUB_REPOSITORY" --dir verified-release \
            --pattern research-bot-0.4.2-android.apk --pattern BUILD_INFO-android.json \
            --pattern SHA256SUMS-android.txt --pattern RELEASE_AUDIT-2026-10-09.md
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync('downloads/android/BUILD_INFO.json', 'utf8'));
          const info = JSON.parse(readFileSync('verified-release/BUILD_INFO-android.json', 'utf8'));
          assert.deepEqual(info, expected, 'Uploaded metadata must match the verified production build.');
          assert.equal(info.version, '0.4.2');
          assert.equal(info.kind, 'fresh-release');
          assert.equal(info.validation.android16SignedApkStartupAndPersistence, 'passed');
          assert.equal(info.validation.android16FreshAndLegacyCoexistence, 'passed');
          const apk = readFileSync('verified-release/research-bot-0.4.2-android.apk');
          assert.equal(apk.length, info.apkBytes);
          assert.equal(createHash('sha256').update(apk).digest('hex'), info.apkSha256);
          const entries = readFileSync('verified-release/SHA256SUMS-android.txt', 'utf8').trim().split('\n');
          const names = ['BUILD_INFO-android.json', 'research-bot-0.4.2-android.apk', 'RELEASE_AUDIT-2026-10-09.md'];
          assert.equal(entries.length, names.length);
          for (const name of names) {
            const actual = createHash('sha256').update(readFileSync(`verified-release/${name}`)).digest('hex');
            assert.ok(entries.includes(`${actual}  ${name}`), `Uploaded checksum mismatch: ${name}`);
          }
          assert.equal(info.githubReleaseRun, 'https://github.com/Srimi1/research------bot/actions/runs/37957568655');
          const api = path => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const run = api('repos/Srimi1/research------bot/actions/runs/37957568655');
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          const release = api('repos/Srimi1/research------bot/releases/407721733');
          assert.equal(release.tag_name, 'v0.4.2');
          assert.equal(release.target_commitish, run.head_sha, 'Publish the exact previously tested checkout.');
          console.log(`Verified uploaded production APK and passed Android runtime run: ${info.apkSha256}`);
          NODE
      - name: Publish the verified production release
        run: |
          gh release edit v0.4.2 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false \
            --latest=true --notes-file docs/releases/v0.4.2.md
          gh release view v0.4.2 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url
