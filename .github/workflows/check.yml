name: Check Research Bot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run test:toolchain
      - run: npm test
      # The SQLite store runs on Electron's bundled Node in the real app, so test it there too.
      - run: npm run test:electron-node
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:electron

  # Builds what a release ships (unsigned, publishes nothing): the AppImage and NSIS installer
  # with their auto-update manifests, plus installed Apple Silicon and Intel DMGs. Catches packaging and
  # update-manifest breakage before a release is tagged.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            manifest: latest-linux.yml
          - os: windows-latest
            target: --win nsis
            manifest: latest.yml
          - os: macos-15
            target: --mac dmg --arm64
            mac_arch: arm64
          - os: macos-15-intel
            target: --mac dmg --x64
            mac_arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:toolchain
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Install and test the actual Mac DMG
        if: matrix.mac_arch
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/macos-dmg-smoke.mjs "release/research-bot-$version-mac-${{ matrix.mac_arch }}.dmg"
      - name: Check the update manifest names a built file
        if: matrix.manifest
        run: |
          manifest="release/${{ matrix.manifest }}"
          test -f "$manifest" || { echo "::error::$manifest was not generated"; exit 1; }
          file="$(sed -n 's/^path: //p' "$manifest")"
          test -f "release/$file" || { echo "::error::$manifest points at $file, which was not built"; exit 1; }
          echo "$manifest -> $file"

  # Compile/lint, then exercise the packaged native activity, WebView and SQLite on Android 16.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired "tools" package, which no longer exists.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build:android
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Check the APK carries the package.json version
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          version="$("$aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          expected="$(node -p "require('./package.json').version")"
          echo "APK version $version"
          test "$version" = "$expected" || { echo "::error::APK version $version does not match package.json $expected"; exit 1; }
      - name: Install the persistent Android accessibility driver
        run: |
          python3 -m venv "$RUNNER_TEMP/research-android-qa"
          "$RUNNER_TEMP/research-android-qa/bin/pip" install uiautomator2==3.7.0
          echo "RESEARCH_UIAUTOMATOR_PYTHON=$RUNNER_TEMP/research-android-qa/bin/python" >> "$GITHUB_ENV"
      - name: Enable KVM for the Android runtime test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify APK startup and saved projects on Android 16
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            node scripts/android-startup-smoke.mjs android/app/build/outputs/apk/debug/app-debug.apk
            cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      # Without instrumentation (an instrumented process counts as foreground), with a real browser
      # in front of the app for longer than Android's background grace period.
      - name: Sign-in token exchange after browser consent on Android 16
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            node scripts/android-background-exchange.mjs android/app/build/outputs/apk/debug/app-debug.apk --consent-seconds=75
            node scripts/android-background-exchange.mjs android/app/build/outputs/apk/debug/app-debug.apk --consent-seconds=20 --data-saver
      - uses: actions/upload-artifact@v4
        with:
          name: research-bot-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup
          path: |
            android-startup-results/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
