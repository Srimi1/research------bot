name: Check Research Bot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # The SQLite store runs on Electron's bundled Node in the real app, so test it there too.
      - run: npm run test:electron-node
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:electron

  # Builds what a release ships (unsigned, publishes nothing): the AppImage and NSIS installer
  # with their auto-update manifests, plus an unpacked macOS app. Catches packaging and
  # update-manifest breakage before a release is tagged.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            manifest: latest-linux.yml
          - os: windows-latest
            target: --win nsis
            manifest: latest.yml
          - os: macos-latest
            target: --mac --dir
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Check the update manifest names a built file
        if: matrix.manifest
        run: |
          manifest="release/${{ matrix.manifest }}"
          test -f "$manifest" || { echo "::error::$manifest was not generated"; exit 1; }
          file="$(sed -n 's/^path: //p' "$manifest")"
          test -f "release/$file" || { echo "::error::$manifest points at $file, which was not built"; exit 1; }
          echo "$manifest -> $file"

  # Builds the Android app the way a release does, but debug-signed, and runs Android lint.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired "tools" package, which no longer exists.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build:android
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Check the APK carries the package.json version
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          version="$("$aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          expected="$(node -p "require('./package.json').version")"
          echo "APK version $version"
          test "$version" = "$expected" || { echo "::error::APK version $version does not match package.json $expected"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
