name: Check Research Bot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # The SQLite store runs on Electron's bundled Node in the real app, so test it there too.
      - run: npm run test:electron-node
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:electron

  # Builds what a release ships (unsigned, publishes nothing): the AppImage and NSIS installer
  # with their auto-update manifests, plus an unpacked macOS app. Catches packaging and
  # update-manifest breakage before a release is tagged.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            manifest: latest-linux.yml
          - os: windows-latest
            target: --win nsis
            manifest: latest.yml
          - os: macos-latest
            target: --mac --dir
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Check the update manifest names a built file
        if: matrix.manifest
        run: |
          manifest="release/${{ matrix.manifest }}"
          test -f "$manifest" || { echo "::error::$manifest was not generated"; exit 1; }
          file="$(sed -n 's/^path: //p' "$manifest")"
          test -f "release/$file" || { echo "::error::$manifest points at $file, which was not built"; exit 1; }
          echo "$manifest -> $file"
