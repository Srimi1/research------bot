name: Publish desktop release

# Publishing a GitHub release builds the installers and attaches them together with the
# update manifests (latest-linux.yml, latest.yml) that installed copies of the app read.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.2.0

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: --linux AppImage
          - os: windows-latest
            platform: windows
            target: --win nsis
    runs-on: ${{ matrix.os }}
    env:
      RESEARCH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Installed apps compare the version in the update manifest, which comes from package.json.
      # A tag that disagrees would publish a release that auto-update never offers.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$RESEARCH_RELEASE_TAG" ]; then
            echo "::error::Release tag $RESEARCH_RELEASE_TAG does not match package.json ($expected). Bump the version, then tag."
            exit 1
          fi
      - run: npm ci
      # The full suite runs in CI on Linux; one of its checks reads Unix file permissions.
      - if: matrix.platform == 'linux'
        run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Collect release files
        run: |
          mkdir upload
          # Installers, their block maps, and the update manifests. Names come from build.artifactName
          # and contain no spaces, so the manifests point at exactly the uploaded files.
          cp release/research-bot-* release/latest*.yml upload/
          if [ "${{ matrix.platform }}" = linux ]; then
            git archive --format=zip --prefix=research-bot/ --output=upload/research-bot.zip HEAD
          fi
          cd upload
          sha256sum -- * > "SHA256SUMS-${{ matrix.platform }}.txt"
          ls -l
      - name: Upload release files
        run: gh release upload "$RESEARCH_RELEASE_TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber
