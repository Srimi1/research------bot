name: Publish desktop release

# Builds the installers and attaches them, with the update manifests (latest-linux.yml,
# latest.yml) that installed copies of the app read, to a GitHub release. Either publish a
# release on GitHub, or run this workflow by hand with a tag: a manual run creates the release
# (and its tag, on the commit it runs from) when it does not exist yet.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0. Must match the version in package.json.
        required: true
        default: v0.2.0

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RESEARCH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Check the tag matches package.json
        run: |
          if ! [[ "$RESEARCH_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3, got: $RESEARCH_RELEASE_TAG"
            exit 1
          fi
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$RESEARCH_RELEASE_TAG" ]; then
            echo "::error::Release tag $RESEARCH_RELEASE_TAG does not match package.json ($expected). Bump the version, then release."
            exit 1
          fi
      # A release created with the workflow token does not start this workflow again,
      # so the build jobs below run exactly once.
      - name: Create the release if it does not exist yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          if gh release view "$RESEARCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RESEARCH_RELEASE_TAG already exists; the build will upload into it."
            exit 0
          fi
          notes="docs/releases/$RESEARCH_RELEASE_TAG.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$RESEARCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Research Bot ${RESEARCH_RELEASE_TAG#v}" --latest "${notes_args[@]}"
          echo "Created release $RESEARCH_RELEASE_TAG on $GITHUB_SHA."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: --linux AppImage
          - os: windows-latest
            platform: windows
            target: --win nsis
    runs-on: ${{ matrix.os }}
    env:
      RESEARCH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Installed apps compare the version in the update manifest, which comes from package.json.
      # A tag that disagrees would publish a release that auto-update never offers.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$RESEARCH_RELEASE_TAG" ]; then
            echo "::error::Release tag $RESEARCH_RELEASE_TAG does not match package.json ($expected). Bump the version, then tag."
            exit 1
          fi
      - run: npm ci
      # The full suite runs in CI on Linux; one of its checks reads Unix file permissions.
      - if: matrix.platform == 'linux'
        run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Collect release files
        run: |
          mkdir upload
          # Installers, their block maps, and the update manifests. Names come from build.artifactName
          # and contain no spaces, so the manifests point at exactly the uploaded files.
          cp release/research-bot-* release/latest*.yml upload/
          if [ "${{ matrix.platform }}" = linux ]; then
            git archive --format=zip --prefix=research-bot/ --output=upload/research-bot.zip HEAD
          fi
          cd upload
          sha256sum -- * > "SHA256SUMS-${{ matrix.platform }}.txt"
          ls -l
      - name: Upload release files
        run: gh release upload "$RESEARCH_RELEASE_TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber
