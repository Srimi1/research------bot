name: Publish release

# Builds the installers and attaches them, with the update manifests (latest-linux.yml,
# latest.yml) that installed copies of the app read, to a GitHub release. The signed Android APK
# and its SHA256SUMS-android.txt are attached too; the Android app updates itself from those. Either publish a
# release on GitHub, or run this workflow by hand with a tag: a manual run creates the release
# (and its tag, on the commit it runs from) when it does not exist yet.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.4. Must match the version in package.json.
        required: true
        default: v0.3.4
      android_source:
        description: Build with signing secrets, or verify the signed APK committed in downloads/android.
        type: choice
        required: true
        default: build
        options:
          - build
          - prebuilt

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RESEARCH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Check the tag matches package.json
        run: |
          if ! [[ "$RESEARCH_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3, got: $RESEARCH_RELEASE_TAG"
            exit 1
          fi
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$RESEARCH_RELEASE_TAG" ]; then
            echo "::error::Release tag $RESEARCH_RELEASE_TAG does not match package.json ($expected). Bump the version, then release."
            exit 1
          fi
      - name: Check Android signing configuration before building or creating a release
        if: github.event_name != 'workflow_dispatch' || inputs.android_source != 'prebuilt'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Configure release signing as described in docs/android.md."
              exit 1
            fi
          done
      # A release created with the workflow token does not start this workflow again,
      # so the build jobs below run exactly once.
      - name: Create the release if it does not exist yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          if gh release view "$RESEARCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RESEARCH_RELEASE_TAG already exists; the build will upload into it."
            exit 0
          fi
          notes="docs/releases/$RESEARCH_RELEASE_TAG.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$RESEARCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Research Bot ${RESEARCH_RELEASE_TAG#v}" --draft "${notes_args[@]}"
          echo "Created draft $RESEARCH_RELEASE_TAG on $GITHUB_SHA; it is published after all uploads succeed."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: --linux AppImage
          - os: windows-latest
            platform: windows
            target: --win nsis
    runs-on: ${{ matrix.os }}
    env:
      RESEARCH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Installed apps compare the version in the update manifest, which comes from package.json.
      # A tag that disagrees would publish a release that auto-update never offers.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$RESEARCH_RELEASE_TAG" ]; then
            echo "::error::Release tag $RESEARCH_RELEASE_TAG does not match package.json ($expected). Bump the version, then tag."
            exit 1
          fi
      - run: npm ci
      # The full suite runs in CI on Linux; one of its checks reads Unix file permissions.
      - if: matrix.platform == 'linux'
        run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Collect release files
        run: |
          mkdir upload
          # Installers, their block maps, and the update manifests. Names come from build.artifactName
          # and contain no spaces, so the manifests point at exactly the uploaded files.
          cp release/research-bot-* release/latest*.yml upload/
          if [ "${{ matrix.platform }}" = linux ]; then
            git archive --format=zip --prefix=research-bot/ --output=upload/research-bot.zip HEAD
          fi
          cd upload
          sha256sum -- * > "SHA256SUMS-${{ matrix.platform }}.txt"
          ls -l
      - name: Upload release files
        run: gh release upload "$RESEARCH_RELEASE_TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RESEARCH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ANDROID_SOURCE: ${{ inputs.android_source || 'build' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired "tools" package, which no longer exists.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      # Every release must be signed with the same key, or installed copies refuse the update.
      # See docs/android.md for creating the key and adding these secrets.
      - name: Restore the signing key
        if: env.ANDROID_SOURCE == 'build'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set. Follow docs/android.md to add the signing key."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: npm ci
        if: env.ANDROID_SOURCE == 'build'
      - run: npm test
        if: env.ANDROID_SOURCE == 'build'
      - run: npm run build:android
        if: env.ANDROID_SOURCE == 'build'
      - name: Build the signed APK
        if: env.ANDROID_SOURCE == 'build'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease lintRelease
      - name: Verify the committed APK and its source provenance
        if: env.ANDROID_SOURCE == 'prebuilt'
        run: node scripts/verify-release-apk.mjs
      - name: Verify and collect the APK
        run: |
          version="${RESEARCH_RELEASE_TAG#v}"
          mkdir upload
          if [ "$ANDROID_SOURCE" = prebuilt ]; then
            cp "downloads/android/research-bot-$version-android.apk" upload/
            cp downloads/android/BUILD_INFO.json upload/BUILD_INFO-android.json
          else
            cp android/app/build/outputs/apk/release/app-release.apk "upload/research-bot-$version-android.apk"
          fi
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "upload/research-bot-$version-android.apk"
          cd upload
          sha256sum -- * > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt
      - name: Enable KVM for the signed APK runtime test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the signed release APK opens and saves projects on Android 16
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/android-startup-smoke.mjs "upload/research-bot-${RESEARCH_RELEASE_TAG#v}-android.apk"
      - name: Upload release files
        run: gh release upload "$RESEARCH_RELEASE_TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-apk-startup
          path: android-startup-results/
          if-no-files-found: ignore
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    needs: [build, android]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RESEARCH_RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the completed draft
        run: |
          draft="$(gh release view "$RESEARCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" = true ]; then
            gh release edit "$RESEARCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
